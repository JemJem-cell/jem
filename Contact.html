
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Page</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: url("geometric-abstract.gif") center center / cover no-repeat fixed;
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
            padding-bottom: 30px;
        }

        h1 {
            text-align: center;
            font-size: clamp(28px, 5vw, 42px);
            margin: 15px 10px 25px;
        }

        /* TOP-RIGHT NAVIGATION */
        .navigation {
            position: absolute;
            top: 20px;
            right: 20px;
            left: 20px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            z-index: 10;
        }

        .nav-btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.92);
            color: #555;
            padding: 12px 18px;
            border-radius: 4px;
            font-size: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
            transition: 0.3s;
        }

        .nav-btn i {
            margin-right: 7px;
        }

        .nav-btn:hover {
            background: white;
            color: #163b7a;
            transform: translateY(-3px);
        }

        /* Contact Form Container */
        .container {
            width: min(90%, 650px);
            margin: 0 auto;
            padding: clamp(20px, 5vw, 40px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 25px;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        form {
            width: 100%;
            text-align: center;
        }

        label {
            display: block;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input[type="text"],
        select,
        textarea {
            display: block;
            width: 100%;
            max-width: 100%;
            padding: 13px;
            margin: 0 0 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.95);
            color: #222;
            font-family: inherit;
            font-size: 16px;
        }

        input[type="text"],
        select {
            min-height: 46px;
        }

        textarea {
            min-height: 160px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: 2px solid #04AA6D;
            outline-offset: 2px;
        }

        input[type="submit"] {
            display: block;
            width: 100%;
            max-width: 220px;
            margin: 5px auto 0;
            padding: 14px 20px;
            background: #04AA6D;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        input[type="submit"]:hover {
            background: #038b58;
            transform: translateY(-2px);
        }

        /* Tablets */
        @media (max-width: 768px) {
            body {
                background-attachment: scroll;
            }

            .navigation {
                padding: 15px;
            }

            .container {
                width: 92%;
            }
        }

        /* Mobile Phones */
        @media (max-width: 480px) {
            .navigation {
                justify-content: center;
                padding: 15px 12px 5px;
            }

            .nav-btn {
                width: 100%;
                padding: 12px;
            }

            h1 {
                margin: 20px 10px;
            }

            .container {
                width: 94%;
                padding: 20px 16px;
                border-radius: 18px;
            }

            label {
                font-size: 15px;
            }

            input[type="text"],
            select,
            textarea {
                font-size: 16px;
                padding: 12px;
            }

            textarea {
                min-height: 140px;
            }

            input[type="submit"] {
                max-width: none;
            }
        }
    </style>
</head>

<body>

   <nav class="navigation">
        <a href="index.html" class="nav-btn">
            <i class="fa-solid fa-house"></i>Home
        </a>

        <a href="About.html" class="nav-btn">
            <i class="fa-solid fa-circle-info"></i>About
        </a>

        <a href="Product.html" class="nav-btn">
            <i class="fa-solid fa-briefcase"></i>Product
        </a>

        <a href="Contact.html" class="nav-btn">
            <i class="fa-solid fa-envelope"></i>Contact
        </a>
    </nav>
    <h1>Contact Us!</h1>

    <div class="container">
        <form action="action_page.php" method="post">

            <label for="fname">First Name</label>
            <input type="text" id="fname" name="firstname"
                placeholder="Your Name" required>

            <label for="lname">Last Name</label>
            <input type="text" id="lname" name="lastname"
                placeholder="Your Last Name" required>

            <label for="country">Country</label>
            <select id="country" name="country" required>
                <option value="Philippines">Philippines</option>
                <option value="USA">USA</option>
                <option value="Canada">Canada</option>
            </select>

            <label for="subject">Subject</label>
            <textarea id="subject" name="subject"
                placeholder="Write something..." required></textarea>

            <input type="submit" value="Submit">

        </form>
    </div>

</body>
</html>
